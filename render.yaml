# Render Blueprint Specification for NilePixel Offline Field Tracker
# Free full-stack deployment on Render: Express API Web Service + React PWA Static Site

services:
  # 1. Backend Express API Web Service (Free Tier)
  - type: web
    name: nilepixel-field-tracker-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: postgresql://postgres.rmfkkpmfnymvksyvdjyy:RidzTKaqHAF57wd4@aws-1-eu-north-1.pooler.supabase.com:6543/postgres?pgbouncer=true&sslmode=require
      - key: DIRECT_URL
        value: postgresql://postgres.rmfkkpmfnymvksyvdjyy:RidzTKaqHAF57wd4@aws-1-eu-north-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: SUPABASE_URL
        value: https://rmfkkpmfnymvksyvdjyy.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_vdTAubPm21xSVSXmclCv2A_bTQZhgrn

  # 2. Frontend React PWA Static Site (Free on Render Global CDN)
  - type: web
    name: nilepixel-field-tracker-client
    runtime: static
    rootDir: client
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://rmfkkpmfnymvksyvdjyy.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: sb_publishable_vdTAubPm21xSVSXmclCv2A_bTQZhgrn
      - key: VITE_API_BASE_URL
        value: https://nilepixel-field-tracker-api.onrender.com
